name: manifest-hashes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  manifest-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned hashes against package-manifest.json
        run: python3 -m unittest -v tests.test_manifest_hashes
